[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; --- IMPOSTAZIONI OTA E MONITOR WIFI ---
upload_protocol = espota
upload_port = PHIL-KIOSK.local
monitor_port = socket://192.168.1.79:23
; --

build_flags = 
	-DCORE_DEBUG_LEVEL=0
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    knolleary/PubSubClient
    tzapu/WiFiManager
    miguelbalboa/MFRC522
    adafruit/Adafruit NeoPixel