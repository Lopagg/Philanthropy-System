[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1 ; Profilo generico S3 (adatto al WROOM-1)
framework = arduino
monitor_speed = 115200

upload_protocol = espota
upload_port = RAT-V2.local

; Impostazioni essenziali per ESP32-S3 con USB CDC nativa
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0

; Partizioni personalizzate (se decideremo di usare la memoria flash per l'audio)
; board_build.partitions = default.csv

lib_deps = 
    tzapu/WiFiManager
    knolleary/PubSubClient
    marcoschwartz/LiquidCrystal_I2C
    adafruit/Adafruit MCP23017 Arduino Library
    adafruit/Adafruit NeoPixel
    adafruit/Adafruit SSD1306
    bblanchon/ArduinoJson
    jandrassy/TelnetStream
    adafruit/RTClib
    adafruit/Adafruit BusIO
    adafruit/Adafruit Unified Sensor
    esphome/ESP32-audioI2S